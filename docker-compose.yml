      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dama -d dama"]
      interval: 5s
      timeout: 3s
      retries: 10

  alert-service:
    build: ./alert-service
    ports:
      - "${ALERTAS_PORTA:-4000}:4000"

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    environment:
      ALERTAS_URL: http://alert-service:4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dama
      DB_USER: dama
      DB_PASSWORD: dama
    ports:
      - "8080:8080"
