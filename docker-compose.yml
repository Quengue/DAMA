version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dama
      POSTGRES_USER: dama
      POSTGRES_PASSWORD: dama
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dama -d dama"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dama
      DB_USER: dama
      DB_PASSWORD: dama
    ports:
      - "8080:8080"
