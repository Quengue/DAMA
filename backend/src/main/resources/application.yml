spring:
  application:
    name: dama-intelligence-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dama}
    username: ${DB_USER:dama}
    password: ${DB_PASSWORD:dama}
  jdbc:
    template:
      query-timeout: 5

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    br.com.dama.intelligence: INFO
