services:
  projects-db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: projects, POSTGRES_USER: ia, POSTGRES_PASSWORD: ia}
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ia -d projects"], interval: 5s, timeout: 3s, retries: 10}
  usages-db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: usages, POSTGRES_USER: ia, POSTGRES_PASSWORD: ia}
    ports: ["5434:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ia -d usages"], interval: 5s, timeout: 3s, retries: 10}
  project-service:
    build: ./project-service
    environment: {DB_URL: jdbc:postgresql://projects-db:5432/projects, DB_USER: ia, DB_PASSWORD: ia}
    ports: ["8081:8081"]
    depends_on: {projects-db: {condition: service_healthy}}
  usage-service:
    build: ./usage-service
    environment: {DB_URL: jdbc:postgresql://usages-db:5432/usages, DB_USER: ia, DB_PASSWORD: ia, PROJECT_SERVICE_URL: http://project-service:8081}
    ports: ["8082:8082"]
    depends_on: {usages-db: {condition: service_healthy}, project-service: {condition: service_started}}
  frontend:
    build: ./frontend
    environment: {PROJECT_URL: http://project-service:8081, USAGE_URL: http://usage-service:8082}
    ports: ["3000:3000"]
    depends_on: [project-service, usage-service]
