services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: iadb, POSTGRES_USER: ia, POSTGRES_PASSWORD: ia}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ia -d iadb"], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build: .
    environment: {DB_URL: jdbc:postgresql://db:5432/iadb, DB_USER: ia, DB_PASSWORD: ia}
    ports: ["8080:8080"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build: ./frontend
    environment: {API_BASE_URL: http://backend:8080}
    ports: ["3000:3000"]
    depends_on: [backend]
